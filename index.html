<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geodefence</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #f8f9fa; font-family: 'Roboto', sans-serif; user-select: none;
        }

        #gameCanvas { display: block; width: 100%; height: 100%; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .panel {
            background: rgba(255, 255, 255, 0.95); border: 1px solid #dee2e6;
            border-radius: 8px; padding: 15px; pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); backdrop-filter: blur(4px);
        }

        /* Test Controls (Top Left) */
        #test-controls {
            position: absolute; top: 20px; left: 20px;
            display: flex; gap: 8px; align-items: center; padding: 10px;
        }
        #test-controls select { padding: 5px; border-radius: 4px; border: 1px solid #bdc3c7; font-family: inherit; }

        #top-bar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 40px; font-size: 18px; font-weight: 700; color: #2c3e50; align-items: center;
        }

        #bottom-bar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; align-items: center;
        }

        /* Hover Info Panels (Top Right) */
        #info-panel, #enemy-info-panel {
            position: absolute; right: 20px; width: 200px; display: none; flex-direction: column; gap: 10px;
        }
        #info-panel { top: 20px; }
        #enemy-info-panel { top: 180px; } /* Sits below turret panel if both are active */

        .info-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; color: #2c3e50;}
        .info-val { color: #8e44ad; }
        .enemy-val { color: #e74c3c; }

        .stat-label { font-size: 11px; color: #6c757d; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 2px; }

        /* Health Bar Styles */
        .health-wrapper { display: flex; align-items: center; gap: 10px; }
        .health-bar-bg { width: 100px; height: 12px; background: #e9ecef; border-radius: 6px; overflow: hidden; border: 1px solid #ced4da;}
        .health-bar-fill { height: 100%; background: #2ecc71; width: 100%; transition: width 0.3s, background 0.3s; }

        .btn {
            background: #3498db; color: white; border: none; padding: 10px 15px;
            font-family: 'Roboto', sans-serif; font-weight: bold; font-size: 13px;
            border-radius: 6px; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 4px rgba(52, 152, 219, 0.3);
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; box-shadow: none; filter: none; }

        .btn-rapid { background: #e74c3c; box-shadow: 0 2px 4px rgba(231, 76, 60, 0.3); }
        .btn-sniper { background: #f39c12; box-shadow: 0 2px 4px rgba(243, 156, 18, 0.3); }
        .btn-splash { background: #16a085; box-shadow: 0 2px 4px rgba(22, 160, 133, 0.3); }
        .btn-action { background: #e67e22; padding: 12px 24px; font-size: 15px;}
        .btn-shop { background: #8e44ad; padding: 12px 24px; font-size: 15px;}

        #instruction {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            color: #2c3e50; font-size: 15px; font-weight: bold; text-align: center;
            background: rgba(255,255,255,0.9); padding: 10px 20px; border-radius: 20px;
            pointer-events: none; display: none; border: 1px solid #dee2e6;
        }

        #shop-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; display: none; flex-direction: column; gap: 15px; z-index: 10;
        }
        #shop-modal h2 { margin: 0 0 10px 0; color: #2c3e50; text-align: center; border-bottom: 2px solid #e9ecef; padding-bottom: 10px;}
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8f9fa; border-radius: 6px; border: 1px solid #dee2e6; }
        .shop-info strong { display: block; color: #2c3e50; font-size: 15px; }
        .shop-info span { font-size: 12px; color: #6c757d; }

        .snap-toggle {
            display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 14px; 
            color: #2c3e50; cursor: pointer; background: #ecf0f1; padding: 8px 12px; 
            border-radius: 6px; border: 1px solid #bdc3c7; transition: background 0.2s;
        }
        .snap-toggle:hover { background: #e2e6e9; }
        .snap-toggle input { cursor: pointer; width: 16px; height: 16px; margin: 0; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">

        <!-- Testing Tools -->
        <div id="test-controls" class="panel">
            <span style="font-size:12px; font-weight:bold; color:#6c757d;">DEV:</span>
            <select id="sel-skip-wave">
                <option value="5">Wave 5 (Boss)</option>
                <option value="10">Wave 10 (Boss)</option>
                <option value="15">Wave 15 (Boss)</option>
                <option value="20">Wave 20</option>
            </select>
            <button class="btn" id="btn-skip-wave" style="padding: 6px 12px; font-size:12px;">Skip</button>
        </div>

        <div id="top-bar" class="panel">
            <div><span class="stat-label">Wave</span><span id="ui-wave">1</span></div>
            <div><span class="stat-label">Space Used</span><span id="ui-space">0%</span></div>
            <div><span class="stat-label">Money</span>$<span id="ui-money">300</span></div>
            <!-- Dynamic Health Bar -->
            <div>
                <span class="stat-label">Lives</span>
                <div class="health-wrapper">
                    <span id="ui-lives">20</span>
                    <div class="health-bar-bg"><div id="ui-health-fill" class="health-bar-fill"></div></div>
                </div>
            </div>
        </div>
        
        <!-- Hover Panels -->
        <div id="info-panel" class="panel">
            <div style="text-align: center; font-weight: bold; margin-bottom: 5px; color:#2c3e50;" id="info-name">Turret Stats</div>
            <div class="info-row">Damage: <span class="info-val" id="info-dmg">0</span></div>
            <div class="info-row">Fire Rate: <span class="info-val" id="info-fire">0s</span></div>
            <div class="info-row">Range: <span class="info-val" id="info-range">0</span></div>
            <div class="info-row">DPS: <span class="info-val" id="info-dps">0</span></div>
        </div>

        <div id="enemy-info-panel" class="panel">
            <div style="text-align: center; font-weight: bold; margin-bottom: 5px; color:#c0392b;">Enemy Stats</div>
            <div class="info-row">HP: <span class="enemy-val" id="enemy-info-hp">0</span></div>
            <div class="info-row">Speed: <span class="enemy-val" id="enemy-info-speed">0</span></div>
            <div class="info-row">Reward: <span class="enemy-val" id="enemy-info-reward">0</span></div>
        </div>

        <div id="instruction">Scroll to Resize. <br>Snap to <span style="color:#8e44ad">Nodes</span> for +50% Damage!</div>
        
        <div id="bottom-bar" class="panel">
            <label class="snap-toggle" title="Snaps turrets perfectly to the grid, edges, and other shapes!">
                <input type="checkbox" id="toggle-snap" checked> Snap
            </label>

            <!-- Unlockable Turrets -->
            <button class="btn" id="btn-buy-pulse">Pulse (Circle) $50</button>
            <button class="btn btn-rapid" id="btn-buy-rapid" style="display:none;">Rapid (Triangle) $75</button>
            <button class="btn btn-sniper" id="btn-buy-sniper" style="display:none;">Sniper (Square) $120</button>
            <button class="btn btn-splash" id="btn-buy-splash" style="display:none;">Splash (Pentagon) $200</button>
            
            <div style="width:10px;"></div>
            <button class="btn btn-shop" id="btn-open-shop">Shop</button>
            <button class="btn btn-action" id="btn-start-wave">Start Wave 1</button>
        </div>

        <div id="shop-modal" class="panel">
            <h2>Global Upgrades</h2>
            <div class="shop-item"><div class="shop-info"><strong>Damage</strong><span id="txt-upg-dmg">Lvl 0</span></div><button class="btn" id="btn-upg-dmg">$150</button></div>
            <div class="shop-item"><div class="shop-info"><strong>Fire Rate</strong><span id="txt-upg-fire">Lvl 0</span></div><button class="btn" id="btn-upg-fire">$150</button></div>
            <div class="shop-item"><div class="shop-info"><strong>Range</strong><span id="txt-upg-range">Lvl 0</span></div><button class="btn" id="btn-upg-range">$100</button></div>
            <button class="btn" id="btn-close-shop" style="margin-top: 10px; background: #e74c3c;">Close</button>
        </div>
    </div>

<script>
    /** MODULE: GeometrySystem */
    class GeometrySystem {
        static getRegularPolygon(cx, cy, sides, radius, rotation = -Math.PI/2) {
            const points = []; 
            for (let i = 0; i < sides; i++) {
                const angle = rotation + (i * 2 * Math.PI) / sides;
                points.push({ x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) });
            } return points;
        }
        static distSquared(p1, p2) { return (p2.x - p1.x)**2 + (p2.y - p1.y)**2; }
        
        static isPointInPolygon(p, polygon) {
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                let xi = polygon[i].x, yi = polygon[i].y; let xj = polygon[j].x, yj = polygon[j].y;
                let intersect = ((yi > p.y) !== (yj > p.y)) && (p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            } return inside;
        }
        static distToSegmentSquared(p, v, w) {
            let l2 = this.distSquared(v, w);
            if (l2 === 0) return this.distSquared(p, v);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2; t = Math.max(0, Math.min(1, t));
            return this.distSquared(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) });
        }
        static isCircleInsidePolygon(cx, cy, radius, polygon) {
            const center = { x: cx, y: cy };
            if (!this.isPointInPolygon(center, polygon)) return false;
            const r2 = radius * radius;
            for (let i = 0; i < polygon.length; i++) {
                let p1 = polygon[i]; let p2 = polygon[(i + 1) % polygon.length];
                if (this.distToSegmentSquared(center, p1, p2) < r2) return false;
            } return true;
        }
        static doCirclesOverlap(x1, y1, r1, x2, y2, r2) { return this.distSquared({x: x1, y: y1}, {x: x2, y: y2}) < (r1 + r2)**2; }

        static doPolygonsOverlap(polyA, polyB) {
            const polygons = [polyA, polyB];
            for (let i = 0; i < polygons.length; i++) {
                const poly = polygons[i];
                for (let j = 0; j < poly.length; j++) {
                    const p1 = poly[j];
                    const p2 = poly[(j + 1) % poly.length];
                    const axis = { x: p2.y - p1.y, y: p1.x - p2.x };

                    let minA = Infinity, maxA = -Infinity;
                    for (const p of polyA) {
                        const projected = (axis.x * p.x) + (axis.y * p.y);
                        minA = Math.min(minA, projected);
                        maxA = Math.max(maxA, projected);
                    }

                    let minB = Infinity, maxB = -Infinity;
                    for (const p of polyB) {
                        const projected = (axis.x * p.x) + (axis.y * p.y);
                        minB = Math.min(minB, projected);
                        maxB = Math.max(maxB, projected);
                    }

                    if (maxA <= minB || maxB <= minA) return false;
                }
            }
            return true;
        }

        static doCirclePolygonOverlap(circleX, circleY, circleRadius, polyPoints) {
            for (let i = 0; i < polyPoints.length; i++) {
                const p1 = polyPoints[i];
                const p2 = polyPoints[(i + 1) % polyPoints.length];
                const distSq = this.distToSegmentSquared({ x: circleX, y: circleY }, p1, p2);
                if (distSq < circleRadius ** 2) return true;
            }
            return false;
        }
    }

    /** MODULE: Renderer */
    class Renderer {
        constructor(canvasId) {
            this.canvas = document.getElementById(canvasId); this.ctx = this.canvas.getContext('2d', { alpha: false });
            this.resize(); window.addEventListener('resize', () => this.resize());
            this.colors = {
                bg: '#f8f9fa', grid: '#e9ecef', axis: '#ced4da',
                polyOutline: '#2c3e50', polyFill: 'rgba(52, 152, 219, 0.05)',
                node: '#8e44ad', nodeGlow: 'rgba(142, 68, 173, 0.4)',
                turretNormal: '#2980b9', turretSynergy: '#8e44ad',
                valid: 'rgba(46, 204, 113, 0.3)', validOutline: '#27ae60',
                invalid: 'rgba(231, 76, 60, 0.3)', invalidOutline: '#c0392b',
                enemyBase: '#e67e22', enemyFast: '#f1c40f', enemyTank: '#34495e', boss: '#c0392b',
                projectile: '#2c3e50', splashArea: 'rgba(231, 76, 60, 0.2)', hitFlash: '#ffffff'
            };
        }
        resize() {
            this.width = window.innerWidth; this.height = window.innerHeight;
            this.canvas.width = this.width; this.canvas.height = this.height;
            this.centerX = this.width / 2;  this.centerY = this.height / 2;
        }
        clear() { this.ctx.fillStyle = this.colors.bg; this.ctx.fillRect(0, 0, this.width, this.height); }
        drawGrid(cellSize = 40) {
            this.ctx.lineWidth = 1; this.ctx.strokeStyle = this.colors.grid; this.ctx.beginPath();
            for (let x = this.centerX % cellSize; x < this.width; x += cellSize) { this.ctx.moveTo(x, 0); this.ctx.lineTo(x, this.height); }
            for (let y = this.centerY % cellSize; y < this.height; y += cellSize) { this.ctx.moveTo(0, y); this.ctx.lineTo(this.width, y); }
            this.ctx.stroke();
        }
        drawPolygon(points, fillStyle, strokeStyle, lineWidth = 3) {
            if (points.length < 3) return;
            this.ctx.beginPath(); this.ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) this.ctx.lineTo(points[i].x, points[i].y);
            this.ctx.closePath();
            if (fillStyle) { this.ctx.fillStyle = fillStyle; this.ctx.fill(); }
            if (strokeStyle) { this.ctx.lineWidth = lineWidth; this.ctx.lineJoin = 'round'; this.ctx.strokeStyle = strokeStyle; this.ctx.stroke(); }
        }
        drawCircle(x, y, radius, fillStyle, strokeStyle, lineWidth = 2, isDashed = false) {
            this.ctx.beginPath(); this.ctx.arc(x, y, radius, 0, Math.PI * 2);
            if (fillStyle) { this.ctx.fillStyle = fillStyle; this.ctx.fill(); }
            if (strokeStyle) {
                this.ctx.lineWidth = lineWidth; this.ctx.strokeStyle = strokeStyle;
                if (isDashed) this.ctx.setLineDash([5, 5]); this.ctx.stroke(); this.ctx.setLineDash([]);
            }
        }
        drawNode(x, y) { this.drawCircle(x, y, 6, this.colors.node, 'white', 2); }
    }

    /** MODULE: InputManager */
    class InputManager {
        constructor(canvas) {
            this.mouse = { x: 0, y: 0, isDown: false, clicked: false, rightClicked: false }; this.scrollDelta = 0;
            window.addEventListener('mousemove', (e) => { this.mouse.x = e.clientX; this.mouse.y = e.clientY; });
            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 0) { this.mouse.isDown = true; this.mouse.clicked = true; } else if (e.button === 2) { this.mouse.rightClicked = true; }
            });
            canvas.addEventListener('mouseup', (e) => { if (e.button === 0) this.mouse.isDown = false; });
            canvas.addEventListener('contextmenu', e => e.preventDefault());
            window.addEventListener('wheel', (e) => { this.scrollDelta = Math.sign(e.deltaY); }, {passive:true});
        }
        resetFrame() { this.mouse.clicked = false; this.mouse.rightClicked = false; this.scrollDelta = 0; }
    }

    /** MODULE: UpgradeSystem */
    class UpgradeSystem {
        constructor() {
            this.dmgLvl = 0; this.fireLvl = 0; this.rangeLvl = 0;
            this.dmgMulti = 1.0; this.fireMulti = 1.0; this.rangeMulti = 1.0;
            this.dmgCost = 150; this.fireCost = 150; this.rangeCost = 100;
        }
        buyDamage(g) { if(g.money >= this.dmgCost){ g.money -= this.dmgCost; this.dmgLvl++; this.dmgMulti += 0.20; this.dmgCost = Math.floor(this.dmgCost*1.5); return true;} return false;}
        buyFireRate(g) { if(g.money >= this.fireCost){ g.money -= this.fireCost; this.fireLvl++; this.fireMulti += 0.15; this.fireCost = Math.floor(this.fireCost*1.5); return true;} return false;}
        buyRange(g) { if(g.money >= this.rangeCost){ g.money -= this.rangeCost; this.rangeLvl++; this.rangeMulti += 0.15; this.rangeCost = Math.floor(this.rangeCost*1.5); return true;} return false;}
    }

    /** MODULE: Projectile */
    class Projectile {
        constructor(x, y, target, speed, damage, splashRadius = 0) {
            this.x = x; this.y = y; this.target = target; this.speed = speed; this.damage = damage; this.radius = 4;
            this.splashRadius = splashRadius; 
            let angle = Math.atan2(target.y - y, target.x - x);
            this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
        }
        update(dt) {
            if (this.target && this.target.hp > 0) {
                let angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
                this.vx = Math.cos(angle) * this.speed; this.vy = Math.sin(angle) * this.speed;
            }
            this.x += this.vx * dt; this.y += this.vy * dt;
        }
        draw(renderer) { renderer.drawCircle(this.x, this.y, this.radius + (this.splashRadius>0 ? 2 : 0), renderer.colors.projectile, null); }
    }

    /** MODULE: Enemies (Now with Math Trails) */
    class Enemy {
        constructor(maxHp, typeColor, speedMult, radius) {
            this.hp = maxHp; this.maxHp = maxHp; this.progress = 1.0; 
            this.speed = 0.05 * speedMult; this.radius = radius; 
            this.x = 0; this.y = 0; this.hitTimer = 0; this.color = typeColor; this.reward = 10;
            this.pathAngle = Math.random() * Math.PI * 2;
            this.pathType = Math.floor(Math.random() * 4); 
            
            this.trail = []; // Stores historical positions for the mathematical line trail
        }
        update(dt, centerX, centerY, targetRadius) {
            if (this.hitTimer > 0) this.hitTimer -= dt;
            this.progress -= this.speed * dt;
            if (this.progress <= 0) return true; 
            
            const startDist = Math.max(window.innerWidth, window.innerHeight);
            const dist = targetRadius + (startDist - targetRadius) * this.progress;
            
            let angle = this.pathAngle;
            if (this.pathType === 0) angle += this.progress * Math.PI * 4; 
            else if (this.pathType === 1) angle -= this.progress * Math.PI * 4; 
            else if (this.pathType === 3) angle += Math.sin(this.progress * Math.PI * 8) * 0.5; 
            
            this.x = centerX + Math.cos(angle) * dist; this.y = centerY + Math.sin(angle) * dist;
            
            // Record Trail
            this.trail.push({x: this.x, y: this.y});
            if (this.trail.length > 35) this.trail.shift(); // Keep trail length limited
            
            return false;
        }
        draw(renderer) {
            // Draw Math Trail First
            if (this.trail.length > 1) {
                renderer.ctx.beginPath();
                renderer.ctx.moveTo(this.trail[0].x, this.trail[0].y);
                for (let i = 1; i < this.trail.length; i++) renderer.ctx.lineTo(this.trail[i].x, this.trail[i].y);
                renderer.ctx.strokeStyle = this.color;
                renderer.ctx.globalAlpha = 0.4;
                renderer.ctx.lineWidth = 2;
                renderer.ctx.stroke();
                renderer.ctx.globalAlpha = 1.0;
            }

            renderer.ctx.shadowBlur = 4; renderer.ctx.shadowColor = 'rgba(0,0,0,0.5)'; renderer.ctx.shadowOffsetY = 2;
            let c = this.hitTimer > 0 ? renderer.colors.hitFlash : this.color;
            renderer.drawCircle(this.x, this.y, this.radius, c, '#d35400', 2);
            renderer.ctx.shadowBlur = 0; renderer.ctx.shadowOffsetY = 0;
            const hpPct = Math.max(0, this.hp / this.maxHp);
            renderer.ctx.fillStyle = 'red'; renderer.ctx.fillRect(this.x - 10, this.y - 20, 20, 4);
            renderer.ctx.fillStyle = '#2ecc71'; renderer.ctx.fillRect(this.x - 10, this.y - 20, 20 * hpPct, 4);
        }
    }
    class Boss extends Enemy {
        constructor(maxHp, color) {
            super(maxHp * 25, color, 0.5, 26); 
            this.reward = 150; this.pathType = 2; 
        }
        draw(renderer) {
            // Boss Math Trail
            if (this.trail.length > 1) {
                renderer.ctx.beginPath();
                renderer.ctx.moveTo(this.trail[0].x, this.trail[0].y);
                for (let i = 1; i < this.trail.length; i++) renderer.ctx.lineTo(this.trail[i].x, this.trail[i].y);
                renderer.ctx.strokeStyle = this.color; renderer.ctx.globalAlpha = 0.5; renderer.ctx.lineWidth = 4;
                renderer.ctx.stroke(); renderer.ctx.globalAlpha = 1.0;
            }

            renderer.ctx.shadowBlur = 15; renderer.ctx.shadowColor = 'rgba(192, 57, 43, 0.7)'; renderer.ctx.shadowOffsetY = 5;
            let c = this.hitTimer > 0 ? renderer.colors.hitFlash : this.color;
            const points = GeometrySystem.getRegularPolygon(this.x, this.y, 8, this.radius, this.progress * Math.PI);
            renderer.drawPolygon(points, c, '#78281f', 3);
            renderer.ctx.shadowBlur = 0; renderer.ctx.shadowOffsetY = 0;
            
            const hpPct = Math.max(0, this.hp / this.maxHp);
            renderer.ctx.fillStyle = 'red'; renderer.ctx.fillRect(this.x - 25, this.y - 35, 50, 6);
            renderer.ctx.fillStyle = '#2ecc71'; renderer.ctx.fillRect(this.x - 25, this.y - 35, 50 * hpPct, 6);
        }
    }

    /** MODULE: Turrets (NO BARRELS, PERFECT TESSELLATION) */
    class Turret {
        constructor(x, y, radius, isSnapped, typeName) {
            this.x = x; this.y = y; this.radius = radius; this.cooldownTimer = 0; 
            this.isSnapped = isSnapped; this.isHovered = false; this.name = typeName;
            this.scale = radius / 15; 
        }
        getCurrentRange(upgrades) { return this.baseRange * upgrades.rangeMulti; }
        getCurrentDamage(upgrades) { return this.baseDamage * upgrades.dmgMulti * (this.isSnapped ? 1.5 : 1.0); }
        getCurrentFireRate(upgrades) { return this.baseFireRate / upgrades.fireMulti; }
        getDPS(upgrades) { return Math.round(this.getCurrentDamage(upgrades) / this.getCurrentFireRate(upgrades)); }

        update(dt, enemies, upgrades, spawnProjectileCb) {
            this.cooldownTimer -= dt;
            let target = null; let currentRange = this.getCurrentRange(upgrades); let minDt = currentRange * currentRange;
            for (let e of enemies) {
                let distSq = GeometrySystem.distSquared(this, e);
                if (distSq <= minDt) { minDt = distSq; target = e; }
            }
            if (target && this.cooldownTimer <= 0) {
                this.cooldownTimer = this.getCurrentFireRate(upgrades);
                spawnProjectileCb(this.x, this.y, target, 1200, this.getCurrentDamage(upgrades), this.splashRadius || 0);
            }
        }
        drawAuraAndRange(renderer, upgrades, color) {
            //if (this.isSnapped) renderer.drawCircle(this.x, this.y, this.radius + 4, renderer.colors.nodeGlow, null);
            if (this.isHovered) renderer.drawCircle(this.x, this.y, this.getCurrentRange(upgrades), 'rgba(46, 204, 113, 0.1)', renderer.colors.validOutline, 1, true);
        }
    }

    /** MODULE: PlacementSystem */
    class PlacementSystem {
        constructor() {
            this.isPlacing = false; this.currentRadius = 25; this.minRadius = 15; this.maxRadius = 80;
            this.isValid = false; this.isSnapped = false; this.pendingType = 'Pulse'; this.pendingCost = 50;
            this.previewX = 0; this.previewY = 0;
        }
        startPlacement(type, cost) { 
            this.isPlacing = true; this.pendingType = type; this.pendingCost = cost; 
            document.getElementById('instruction').style.display = 'block'; 
        }
        endPlacement() { this.isPlacing = false; document.getElementById('instruction').style.display = 'none'; }
        
        update(input, polygonPoints, nodes, placedTurrets) {
            if (!this.isPlacing) return null;
            if (input.mouse.rightClicked) { this.endPlacement(); return null; }
            if (input.scrollDelta !== 0) {
                this.currentRadius -= input.scrollDelta * 4;
                this.currentRadius = Math.max(this.minRadius, Math.min(this.maxRadius, this.currentRadius));
            }

            let mx = input.mouse.x; let my = input.mouse.y; this.isSnapped = false;
            let snapEnabled = document.getElementById('toggle-snap').checked;

            if (snapEnabled) {
                let gridSize = 20; mx = Math.round(mx / gridSize) * gridSize; my = Math.round(my / gridSize) * gridSize;
                for (let t of placedTurrets) {
                    let dist = Math.sqrt(GeometrySystem.distSquared({x: mx, y: my}, t));
                    let targetDist = t.radius + this.currentRadius;
                    if (Math.abs(dist - targetDist) < 18) { 
                        let angle = Math.atan2(my - t.y, mx - t.x);
                        mx = t.x + Math.cos(angle) * targetDist; my = t.y + Math.sin(angle) * targetDist; break;
                    }
                }
                for (let i = 0; i < polygonPoints.length; i++) {
                    let p1 = polygonPoints[i]; let p2 = polygonPoints[(i + 1) % polygonPoints.length];
                    let l2 = GeometrySystem.distSquared(p1, p2); if (l2 === 0) continue;
                    let t_proj = ((mx - p1.x) * (p2.x - p1.x) + (my - p1.y) * (p2.y - p1.y)) / l2;
                    t_proj = Math.max(0, Math.min(1, t_proj));
                    let projX = p1.x + t_proj * (p2.x - p1.x); let projY = p1.y + t_proj * (p2.y - p1.y);
                    let distToEdge = Math.sqrt((mx - projX)**2 + (my - projY)**2);
                    if (Math.abs(distToEdge - this.currentRadius) < 18) {
                        let nx = mx - projX; let ny = my - projY; let nLen = Math.sqrt(nx*nx + ny*ny);
                        if (nLen > 0) { mx = projX + (nx/nLen) * this.currentRadius; my = projY + (ny/nLen) * this.currentRadius; }
                    }
                }
            }

            for (let node of nodes) {
                if (GeometrySystem.distSquared({x: mx, y: my}, node) < 625) { mx = node.x; my = node.y; this.isSnapped = true; break; }
            }
            this.previewX = mx; this.previewY = my;

            // 1. Generate the exact points for the shape the player is currently holding
            let pendingPoints = this.pendingType !== 'Pulse' ? GeometrySystem.getRegularPolygon(mx, my, this.sides, this.currentRadius, this.angle) : null; 

            let insidePoly = GeometrySystem.isCircleInsidePolygon(mx, my, this.currentRadius, polygonPoints);
            let overlapping = false;

            for (let t of placedTurrets) { 
                // Broad Phase: Do the bounding circles touch?
                if (GeometrySystem.doCirclesOverlap(mx, my, this.currentRadius, t.x, t.y, t.radius)) { 
                    
                    const pendingIsPoly = (this.pendingType !== 'Pulse'); 
                    const placedIsPoly = (t.type !== 'Pulse' && t.points); 

                    if (pendingIsPoly && placedIsPoly) {
                        // Both Polygons
                        if (GeometrySystem.doPolygonsOverlap(pendingPoints, t.points)) { overlapping = true; break; }
                    } 
                    else if (!pendingIsPoly && !placedIsPoly) {
                        // Both Circles (CirclesOverlap already confirmed it)
                        overlapping = true; break; 
                    } 
                    else {
                        // One Circle, One Polygon
                        const polyPts = pendingIsPoly ? pendingPoints : t.points;
                        const circleX = pendingIsPoly ? t.x : mx;
                        const circleY = pendingIsPoly ? t.y : my;
                        const circleR = pendingIsPoly ? t.radius : this.currentRadius;

                        if (GeometrySystem.doCirclePolygonOverlap(circleX, circleY, circleR, polyPts)) {
                            overlapping = true; break;
                        }
                    }
                } 
            }
            this.isValid = insidePoly && !overlapping;

            if (input.mouse.clicked && this.isValid) {
                this.endPlacement(); 
                if (this.pendingType === 'Pulse') return new PulseTurret(mx, my, this.currentRadius, this.isSnapped);
                if (this.pendingType === 'Rapid') return new RapidTurret(mx, my, this.currentRadius, this.isSnapped);
                if (this.pendingType === 'Sniper') return new SniperTurret(mx, my, this.currentRadius, this.isSnapped);
                if (this.pendingType === 'Splash') return new SplashTurret(mx, my, this.currentRadius, this.isSnapped);
            } 
            return null;
        }
        
        drawPreview(renderer, input, upgrades) {
            if (!this.isPlacing) return;
            let drawX = this.previewX; let drawY = this.previewY;
            const fill = this.isValid ? renderer.colors.valid : renderer.colors.invalid;
            const stroke = this.isValid ? (this.isSnapped ? renderer.colors.nodeGlow : renderer.colors.validOutline) : renderer.colors.invalidOutline;
            
            if (this.pendingType === 'Pulse') { renderer.drawCircle(drawX, drawY, this.currentRadius, fill, stroke, 2); } 
            else if (this.pendingType === 'Rapid') { const pts = GeometrySystem.getRegularPolygon(drawX, drawY, 3, this.currentRadius, -Math.PI/2); renderer.drawPolygon(pts, fill, stroke, 2); } 
            else if (this.pendingType === 'Sniper') { const pts = GeometrySystem.getRegularPolygon(drawX, drawY, 4, this.currentRadius, Math.PI/4); renderer.drawPolygon(pts, fill, stroke, 2); } 
            else if (this.pendingType === 'Splash') { const pts = GeometrySystem.getRegularPolygon(drawX, drawY, 5, this.currentRadius, -Math.PI/2); renderer.drawPolygon(pts, fill, stroke, 2); }
            
            let dummyRange = 0;
            if(this.pendingType==='Pulse') dummyRange = (this.currentRadius*2.5 + 80) * upgrades.rangeMulti;
            if(this.pendingType==='Rapid') dummyRange = (this.currentRadius*2.0 + 50) * upgrades.rangeMulti;
            if(this.pendingType==='Sniper') dummyRange = (this.currentRadius*4.0 + 150) * upgrades.rangeMulti;
            if(this.pendingType==='Splash') dummyRange = (this.currentRadius*3.0 + 100) * upgrades.rangeMulti;
            renderer.drawCircle(drawX, drawY, dummyRange, null, stroke, 1, true);
        }
    }

    /** MODULE: WaveManager */
    class WaveManager {
        constructor() {
            this.wave = 1; this.state = 'WAITING'; this.enemiesToSpawn = 0; this.spawnTimer = 0;
            this.isBossWave = false; this.bossSpawned = false;
        }
        startWave() {
            this.state = 'ACTIVE'; this.isBossWave = (this.wave % 5 === 0); this.bossSpawned = false;
            this.spawnTimer = 0; 
            this.spawnRate = Math.max(0.3, 2.0 - (this.wave * 0.15));
            
            if (this.isBossWave) { this.enemiesToSpawn = 8 + (this.wave * 2); } 
            else { this.enemiesToSpawn = 5 + (this.wave * 3); }
            document.getElementById('btn-start-wave').style.display = 'none';
        }
        endWave(gameRef) {
            this.state = 'WAITING'; 
            if (this.isBossWave) {
                gameRef.towerSides++; 
                if (this.wave >= 5) document.getElementById('btn-buy-rapid').style.display = 'block';
                if (this.wave >= 10) document.getElementById('btn-buy-sniper').style.display = 'block';
                if (this.wave >= 15) document.getElementById('btn-buy-splash').style.display = 'block';
            }
            
            this.wave++;
            gameRef.money += 50 + (this.wave * 15); gameRef.updateUI();
            
            let btn = document.getElementById('btn-start-wave');
            btn.innerText = (this.wave % 5 === 0) ? "Start BOSS Wave " + this.wave : "Start Wave " + this.wave;
            btn.style.background = (this.wave % 5 === 0) ? '#c0392b' : '#e67e22'; 
            btn.style.display = 'block';
        }
        update(dt, gameRef) {
            if (this.state !== 'ACTIVE') return;
            this.spawnTimer -= dt;
            
            if (this.spawnTimer <= 0 && this.enemiesToSpawn > 0) {
                this.spawnTimer = this.spawnRate; this.enemiesToSpawn--;
                let baseHp = 15 + (this.wave * 15);
                
                if (this.isBossWave && !this.bossSpawned) {
                    gameRef.enemies.push(new Boss(baseHp, gameRef.renderer.colors.boss)); this.bossSpawned = true;
                } else {
                    let rand = Math.random();
                    if (rand < 0.2) gameRef.enemies.push(new Enemy(baseHp*0.5, gameRef.renderer.colors.enemyFast, 1.8, 8)); 
                    else if (rand < 0.4) gameRef.enemies.push(new Enemy(baseHp*3, gameRef.renderer.colors.enemyTank, 0.5, 16)); 
                    else gameRef.enemies.push(new Enemy(baseHp, gameRef.renderer.colors.enemyBase, 1.0, 12)); 
                }
            }
            if (this.enemiesToSpawn === 0 && gameRef.enemies.length === 0) this.endWave(gameRef);
        }
    }

    /** MODULE: Game (Main Engine) */
    class Game {
        constructor() {
            this.renderer = new Renderer('gameCanvas'); this.input = new InputManager(this.renderer.canvas);
            
            this.lastCenterX = this.renderer.centerX;
            this.lastCenterY = this.renderer.centerY;
            
            this.towerSides = 4; this.towerRadius = 250;
            this.polygonPoints = []; this.constructionNodes = [];
            this.placedTurrets = []; this.enemies = []; this.projectiles = [];
            
            this.placementSystem = new PlacementSystem(); this.waveManager = new WaveManager(); this.upgrades = new UpgradeSystem();
            this.maxLives = 20; this.lives = 20; this.money = 350; this.isPaused = false;
            
            this.costs = { Pulse: 50, Rapid: 75, Sniper: 120, Splash: 200 };

            this.initUI(); this.lastTime = performance.now(); requestAnimationFrame((t) => this.loop(t));
        }

        initUI() {
            this.updateUI();
            document.getElementById('btn-buy-pulse').addEventListener('click', (e) => { e.stopPropagation(); if(this.money>=this.costs.Pulse) this.placementSystem.startPlacement('Pulse', this.costs.Pulse); });
            document.getElementById('btn-buy-rapid').addEventListener('click', (e) => { e.stopPropagation(); if(this.money>=this.costs.Rapid) this.placementSystem.startPlacement('Rapid', this.costs.Rapid); });
            document.getElementById('btn-buy-sniper').addEventListener('click', (e) => { e.stopPropagation(); if(this.money>=this.costs.Sniper) this.placementSystem.startPlacement('Sniper', this.costs.Sniper); });
            document.getElementById('btn-buy-splash').addEventListener('click', (e) => { e.stopPropagation(); if(this.money>=this.costs.Splash) this.placementSystem.startPlacement('Splash', this.costs.Splash); });
            
            document.getElementById('btn-start-wave').addEventListener('click', (e) => { e.stopPropagation(); this.waveManager.startWave(); });
            
            const shopModal = document.getElementById('shop-modal');
            document.getElementById('btn-open-shop').addEventListener('click', () => { this.isPaused = true; shopModal.style.display = 'flex'; this.updateShopUI(); });
            document.getElementById('btn-close-shop').addEventListener('click', () => { this.isPaused = false; shopModal.style.display = 'none'; });
            
            document.getElementById('btn-upg-dmg').addEventListener('click', () => { if(this.upgrades.buyDamage(this)){ this.updateUI(); this.updateShopUI(); }});
            document.getElementById('btn-upg-fire').addEventListener('click', () => { if(this.upgrades.buyFireRate(this)){ this.updateUI(); this.updateShopUI(); }});
            document.getElementById('btn-upg-range').addEventListener('click', () => { if(this.upgrades.buyRange(this)){ this.updateUI(); this.updateShopUI(); }});
            
            // Testing / Developer Feature: Skip Wave
            document.getElementById('btn-skip-wave').addEventListener('click', () => {
                let target = parseInt(document.getElementById('sel-skip-wave').value);
                this.waveManager.wave = target;
                this.waveManager.state = 'WAITING';
                this.enemies = []; this.projectiles = []; // Clear board
                
                // Set correct tower progression based on target wave
                this.towerSides = 4 + Math.floor((target - 1) / 5);
                
                // Unlock turrets based on wave skipped to
                if (target >= 5) document.getElementById('btn-buy-rapid').style.display = 'block';
                if (target >= 10) document.getElementById('btn-buy-sniper').style.display = 'block';
                if (target >= 15) document.getElementById('btn-buy-splash').style.display = 'block';

                let btn = document.getElementById('btn-start-wave');
                btn.innerText = (target % 5 === 0) ? "Start BOSS Wave " + target : "Start Wave " + target;
                btn.style.background = (target % 5 === 0) ? '#c0392b' : '#e67e22'; 
                btn.style.display = 'block';
                this.updateUI();
            });
        }

        updateShopUI() {
            document.getElementById('txt-upg-dmg').innerText = `Lvl ${this.upgrades.dmgLvl} (+${Math.round((this.upgrades.dmgMulti-1)*100)}%)`; document.getElementById('btn-upg-dmg').innerText = `$${this.upgrades.dmgCost}`; document.getElementById('btn-upg-dmg').disabled = (this.money < this.upgrades.dmgCost);
            document.getElementById('txt-upg-fire').innerText = `Lvl ${this.upgrades.fireLvl} (+${Math.round((this.upgrades.fireMulti-1)*100)}%)`; document.getElementById('btn-upg-fire').innerText = `$${this.upgrades.fireCost}`; document.getElementById('btn-upg-fire').disabled = (this.money < this.upgrades.fireCost);
            document.getElementById('txt-upg-range').innerText = `Lvl ${this.upgrades.rangeLvl} (+${Math.round((this.upgrades.rangeMulti-1)*100)}%)`; document.getElementById('btn-upg-range').innerText = `$${this.upgrades.rangeCost}`; document.getElementById('btn-upg-range').disabled = (this.money < this.upgrades.rangeCost);
        }

        updateUI() {
            document.getElementById('ui-wave').innerText = this.waveManager.wave;
            document.getElementById('ui-money').innerText = this.money;
            document.getElementById('ui-lives').innerText = this.lives;
            
            // Update Health Bar CSS Width and color
            let fill = document.getElementById('ui-health-fill');
            let hpPct = Math.max(0, this.lives / this.maxLives);
            fill.style.width = (hpPct * 100) + '%';
            if (hpPct > 0.5) fill.style.background = '#2ecc71';
            else if (hpPct > 0.25) fill.style.background = '#f1c40f';
            else fill.style.background = '#e74c3c';

            document.getElementById('btn-buy-pulse').disabled = (this.money < this.costs.Pulse);
            document.getElementById('btn-buy-rapid').disabled = (this.money < this.costs.Rapid);
            document.getElementById('btn-buy-sniper').disabled = (this.money < this.costs.Sniper);
            document.getElementById('btn-buy-splash').disabled = (this.money < this.costs.Splash);
            
            let totalPolyArea = 0.5 * this.towerSides * Math.pow(this.towerRadius, 2) * Math.sin((2 * Math.PI) / this.towerSides);
            let usedArea = this.placedTurrets.reduce((sum, t) => sum + Math.PI * Math.pow(t.radius, 2), 0);
            document.getElementById('ui-space').innerText = Math.min(100, Math.round((usedArea / totalPolyArea) * 100)) + '%';
        }
        
        handleHoverLogic() {
            let turretPanel = document.getElementById('info-panel');
            let enemyPanel = document.getElementById('enemy-info-panel');
            
            // Turret Hover Checking
            let hoveredTurret = false;
            if (!this.placementSystem.isPlacing) {
                for (let t of this.placedTurrets) {
                    t.isHovered = (GeometrySystem.distSquared(this.input.mouse, t) < Math.pow(t.radius, 2));
                    if (t.isHovered) {
                        hoveredTurret = true; turretPanel.style.display = 'flex';
                        document.getElementById('info-name').innerText = t.name + (t.isSnapped ? ' (Synergized)' : '');
                        document.getElementById('info-dmg').innerText = Math.round(t.getCurrentDamage(this.upgrades));
                        document.getElementById('info-fire').innerText = t.getCurrentFireRate(this.upgrades).toFixed(2) + 's';
                        document.getElementById('info-range').innerText = Math.round(t.getCurrentRange(this.upgrades));
                        document.getElementById('info-dps').innerText = t.getDPS(this.upgrades);
                    }
                }
            }
            if (!hoveredTurret) turretPanel.style.display = 'none';

            // Enemy Hover Checking
            let hoveredEnemy = false;
            for (let e of this.enemies) {
                if (GeometrySystem.distSquared(this.input.mouse, e) < Math.pow(e.radius * 1.5, 2)) { // Slightly larger hover box for fast enemies
                    hoveredEnemy = true; enemyPanel.style.display = 'flex';
                    document.getElementById('enemy-info-hp').innerText = Math.round(e.hp) + " / " + e.maxHp;
                    // Format speed nicely (0.05 -> 5.0)
                    document.getElementById('enemy-info-speed').innerText = (e.speed * 100).toFixed(1);
                    document.getElementById('enemy-info-reward').innerText = "$" + e.reward;
                    break; 
                }
            }
            if (!hoveredEnemy) enemyPanel.style.display = 'none';
        }

        update(dt) {
            // Check for Window Resizing to keep turrets aligned inside the polygon!
            let dx = this.renderer.centerX - this.lastCenterX;
            let dy = this.renderer.centerY - this.lastCenterY;
            if (dx !== 0 || dy !== 0) {
                for (let t of this.placedTurrets) { t.x += dx; t.y += dy; }
                for (let p of this.projectiles) { p.x += dx; p.y += dy; }
                for (let e of this.enemies) { for (let h of e.trail) { h.x += dx; h.y += dy; } } // Shift enemy trails
                this.lastCenterX = this.renderer.centerX;
                this.lastCenterY = this.renderer.centerY;
            }

            this.polygonPoints = GeometrySystem.getRegularPolygon(this.renderer.centerX, this.renderer.centerY, this.towerSides, this.towerRadius, 
                                 (this.towerSides % 2 === 0 ? Math.PI/4 : -Math.PI/2)); 
            
            this.constructionNodes = [{x: this.renderer.centerX, y: this.renderer.centerY}];
            const offset = (this.towerSides % 2 === 0 ? Math.PI/4 : -Math.PI/2);
            for (let i = 0; i < this.towerSides; i++) {
                const angle = offset + (i * 2 * Math.PI) / this.towerSides;
                this.constructionNodes.push({ x: this.renderer.centerX + (this.towerRadius * 0.55) * Math.cos(angle), y: this.renderer.centerY + (this.towerRadius * 0.55) * Math.sin(angle) });
            }

            this.handleHoverLogic();

            const newTurret = this.placementSystem.update(this.input, this.polygonPoints, this.constructionNodes, this.placedTurrets);
            if (newTurret) { this.money -= this.placementSystem.pendingCost; this.placedTurrets.push(newTurret); this.updateUI(); }

            this.waveManager.update(dt, this);

            for (let t of this.placedTurrets) {
                t.update(dt, this.enemies, this.upgrades, (x, y, target, speed, dmg, splash) => { this.projectiles.push(new Projectile(x, y, target, speed, dmg, splash)); });
            }
            
            for (let i = this.projectiles.length - 1; i >= 0; i--) {
                let p = this.projectiles[i]; p.update(dt);
                if (p.x < 0 || p.x > this.renderer.width || p.y < 0 || p.y > this.renderer.height) { this.projectiles.splice(i, 1); continue; }
                for (let e of this.enemies) {
                    if (GeometrySystem.distSquared(p, e) < (p.radius + e.radius)**2) { 
                        if (p.splashRadius > 0) {
                            for (let other of this.enemies) {
                                if (GeometrySystem.distSquared(e, other) < p.splashRadius * p.splashRadius) {
                                    other.hp -= p.damage; other.hitTimer = 0.05;
                                }
                            }
                            this.renderer.drawCircle(p.x, p.y, p.splashRadius, 'rgba(22, 160, 133, 0.4)', '#16a085', 2);
                        } else {
                            e.hp -= p.damage; e.hitTimer = 0.05; 
                        }
                        this.projectiles.splice(i, 1); break; 
                    }
                }
            }
            for (let i = this.enemies.length - 1; i >= 0; i--) {
                let e = this.enemies[i];
                if (e.hp <= 0) { this.money += e.reward; this.updateUI(); this.enemies.splice(i, 1); continue; }
                if (e.update(dt, this.renderer.centerX, this.renderer.centerY, this.towerRadius)) {
                    this.lives--; this.updateUI(); this.enemies.splice(i, 1);
                    if (this.lives <= 0) { alert("Game Over! Refresh to restart."); this.isPaused = true; }
                }
            }
            this.input.resetFrame();
        }

        draw() {
            this.renderer.clear(); this.renderer.drawGrid();
            this.renderer.drawPolygon(this.polygonPoints, this.renderer.colors.polyFill, this.renderer.colors.polyOutline, 3);
            for (let node of this.constructionNodes) this.renderer.drawNode(node.x, node.y);
            
            for (let t of this.placedTurrets) t.draw(this.renderer, this.upgrades);
            for (let p of this.projectiles) p.draw(this.renderer);
            for (let e of this.enemies) e.draw(this.renderer);

            this.placementSystem.drawPreview(this.renderer, this.input, this.upgrades);
        }

        loop(timestamp) {
            const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1); 
            this.lastTime = timestamp;
            if (!this.isPaused) this.update(dt);
            this.draw(); 
            requestAnimationFrame((t) => this.loop(t));
        }
    }

    window.onload = () => { const game = new Game(); };
</script>
</body>
